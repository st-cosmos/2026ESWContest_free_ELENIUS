# MCUboot — USB CDC ACM 시리얼 리커버리.
# 리셋 후 5초 동안 mcumgr 접속을 기다렸다가 애플리케이션으로 넘어간다.
# (구성 배경은 smart-chemical-shelf/firmware/sysbuild/mcuboot.conf 와 동일)

CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=5000

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Smart Lifejacket Bootloader"
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SERIAL=y

# 부트로더의 CDC ACM 인스턴스는 mcumgr 전용 — 콘솔을 겸하면 빌드가 거부된다.
CONFIG_UART_CONSOLE=n

CONFIG_BOOT_MAX_IMG_SECTORS=256

# 32.768 kHz 크리스탈 미실장 가정 → 내부 RC 오실레이터.
# XTAL 로 두면 크리스탈이 없을 때 LFCLKSTARTED 를 영원히 기다리며 부팅 전에
# 멈춘다. prj.conf 와 반드시 일치시킬 것.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
