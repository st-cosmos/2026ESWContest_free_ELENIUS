#
# Smart lifejacket - E73-2G4M08S1C (nRF52840), BLE broadcast
#

# --- Application ------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
# 미착용 보관 시 System OFF (버클 닫힘 = SENSE 웨이크업)
CONFIG_POWEROFF=y
# 시연 빌드: 보관 슬립 비활성 — 잠들면 BLE/USB 가 전부 꺼지고 버클 SENSE
# 웨이크업이 실패한 사례가 있어(2026-08-29, 배터리 재삽입으로만 복구) 끈다.
# 프로덕션 빌드에서 원복: 이 줄 삭제 (Kconfig 기본값 y)
CONFIG_JACKET_STORAGE_SLEEP=n

# --- Bluetooth --------------------------------------------------------------
# 연결 없는 브로드캐스터 전용. V-PASS(라즈베리파이)가 광고 패킷만 수신한다.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_DEVICE_NAME="V-PASS Jacket"
# +8 dBm — 통달 거리가 안전에 직결 (nRF52840 최대 출력)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Console / logging over the USB-C port ----------------------------------
# 콘솔·셸은 USB CDC ACM. 열거되는 COM 포트를 아무 보레이트로 열면 된다.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Smart Lifejacket"
CONFIG_USB_DEVICE_MANUFACTURER="SmartVPass"
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_JACKET_LOG_LEVEL_INF=y

CONFIG_SHELL=y

# --- 32.768 kHz clock source ------------------------------------------------
# E73 모듈은 32.768 kHz 크리스탈을 내장하지 않는다 (XL1/XL2 핀으로 노출).
# 이 보드에 크리스탈이 실장되지 않았다는 가정으로 내부 RC 를 쓴다 — XTAL 로
# 두면 크리스탈이 없을 때 부팅 전에 멈춘다 (선반 보드에서 실증).
# RC + 주기 캘리브레이션이면 BLE 슬립 클럭 정확도(±500 ppm)를 만족한다.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
