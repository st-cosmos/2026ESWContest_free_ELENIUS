[project]
name = "vpass-application"
version = "0.1.0"
description = "Smart V-PASS 어선 안전 관리 시스템 (라즈베리파이용 애플리케이션)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opencv-contrib-python>=4.8,<5",
    "numpy>=1.26",
    "pyserial>=3.5",
    "smbus2>=0.4",
    # BLE — 구명조끼 광고 수신(jacketble)과 BLE 킬 스위치가 함께 사용
    "bleak>=0.22",
]

[project.optional-dependencies]
# 구명조끼 ML 판정용 TFLite 런타임 (라즈베리파이: uv sync --extra ml)
# 윈도우 개발 환경에는 휠이 없어 linux 로 한정한다 — 미설치 시 HSV 폴백으로 동작.
# tflite-runtime 은 cp311 휠까지만 있어 Python 3.12+ 는 후속 패키지 LiteRT 를 쓴다.
ml = [
    "tflite-runtime>=2.13; sys_platform == 'linux' and python_version < '3.12'",
    "ai-edge-litert>=1.0; sys_platform == 'linux' and python_version >= '3.12'",
]

[project.scripts]
vpass = "vpass.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpass"]

[tool.uv]
# 라즈베리파이(piwheels)에서도 바이너리 휠을 우선 사용한다.
