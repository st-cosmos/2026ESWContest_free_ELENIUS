[project]
name = "vpass-application"
version = "0.1.0"
description = "Smart V-PASS 어선 안전 관리 시스템 (라즈베리파이용 애플리케이션)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "opencv-contrib-python>=4.8,<5",
    "numpy>=1.26",
]

[project.scripts]
vpass = "vpass.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpass"]

[tool.uv]
# 라즈베리파이(piwheels)에서도 바이너리 휠을 우선 사용한다.
