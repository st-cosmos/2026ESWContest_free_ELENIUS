[project]
name = "demo-server"
version = "0.1.0"
description = "Smart V-PASS 데모 관제 서버 (해양경찰 통합 관제 시연용)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
demo-server = "demo_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_server"]
